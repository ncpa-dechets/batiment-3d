# Met en ligne la page de sélection (site/index.html) sur GitHub Pages,
# à chaque modification de la page ou à la demande (onglet Actions > Run workflow).
name: Publier la page de sélection

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publier.sh
